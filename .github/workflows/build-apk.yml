
name: Build SweetConnect APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          set -eu
          unzip -o SweetConnectAndroid-project.zip -d extracted
          find extracted -name settings.gradle -print

      - name: Find Android project
        run: |
          set -eu
          PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "หา settings.gradle ไม่พบ"
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy latest HTML into build project
        run: |
          set -eu
          SOURCE="$GITHUB_WORKSPACE/app/src/main/assets/index.html"
          TARGET="$PROJECT_DIR/app/src/main/assets/index.html"

          if [ ! -f "$SOURCE" ]; then
            echo "ไม่พบ HTML: $SOURCE"
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          echo "คัดลอก index.html แล้ว"

      - name: Copy latest Java into build project
        run: |
          set -eu
          SOURCE="$GITHUB_WORKSPACE/app/src/main/java/com/sweetconnect/app/MainActivity.java"
          TARGET="$PROJECT_DIR/app/src/main/java/com/sweetconnect/app/MainActivity.java"

          if [ ! -f "$SOURCE" ]; then
            echo "ไม่พบ MainActivity.java ใน GitHub: $SOURCE"
            exit 1
          fi

          mkdir -p "$(dirname "$TARGET")"
          cp "$SOURCE" "$TARGET"
          echo "คัดลอก MainActivity.java แล้ว"
          test -s "$TARGET"

      - name: Add AndroidX Core dependency
        run: |
          set -eu
          FILE="$PROJECT_DIR/app/build.gradle"

          if [ ! -f "$FILE" ]; then
            echo "หา app/build.gradle ไม่พบ"
            exit 1
          fi

          if ! grep -q "androidx.core:core" "$FILE"; then
            printf "\ndependencies {\n    implementation 'androidx.core:core:1.15.0'\n}\n" >> "$FILE"
          fi

      - name: Build APK
        run: |
          set -eu
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetConnect-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
