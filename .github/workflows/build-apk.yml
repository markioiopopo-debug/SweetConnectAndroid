name: Build SweetConnect APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          set -eu
          unzip -o SweetConnectAndroid-project.zip -d extracted
          PROJECT_DIR="$(dirname "$(find extracted -name settings.gradle -print -quit)")"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy latest app files
        run: |
          set -eu
          APP="$PROJECT_DIR/app"

          mkdir -p "$APP/src/main/assets"
          mkdir -p "$APP/src/main/java/com/sweetconnect/app"

          cp app/src/main/assets/index.html \
            "$APP/src/main/assets/index.html"

          cp app/src/main/java/com/sweetconnect/app/MainActivity.java \
            "$APP/src/main/java/com/sweetconnect/app/MainActivity.java"

          cp app/src/main/java/com/sweetconnect/app/SweetConnectMessagingService.java \
            "$APP/src/main/java/com/sweetconnect/app/SweetConnectMessagingService.java"

          cp google-services.json "$APP/google-services.json"

      - name: Configure Firebase and Android
        run: |
          set -eu
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          project = Path(os.environ["PROJECT_DIR"])
          root_gradle = project / "build.gradle"
          app_gradle = project / "app" / "build.gradle"
          manifest = project / "app" / "src" / "main" / "AndroidManifest.xml"

          # Add Google Services plugin without deleting existing settings.
          root_text = root_gradle.read_text()
          plugin = "id 'com.google.gms.google-services' version '4.4.4' apply false"
          if "com.google.gms.google-services" not in root_text:
              match = re.search(r"plugins\s*\{", root_text)
              if not match:
                  raise SystemExit("ไม่พบ plugins block ใน build.gradle")
              end = root_text.find("}", match.end())
              if end < 0:
                  raise SystemExit("หา plugins block ปิดไม่พบ")
              root_text = root_text[:end] + "\n    " + plugin + "\n" + root_text[end:]
              root_gradle.write_text(root_text)

          # Apply Google Services plugin inside the app plugins block.
          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              match = re.search(r"plugins\s*\{", app_text)
              if not match:
                  raise SystemExit("ไม่พบ plugins block ใน app/build.gradle")
              end = app_text.find("}", match.end())
              if end < 0:
                  raise SystemExit("หา app plugins block ปิดไม่พบ")
              app_text = app_text[:end] + "\n    id 'com.google.gms.google-services'\n" + app_text[end:]

          # Add dependencies only when missing.
          additions = []
          if "androidx.core:core" not in app_text:
              additions.append("    implementation 'androidx.core:core:1.15.0'")
          if "firebase-bom" not in app_text:
              additions.append("    implementation platform('com.google.firebase:firebase-bom:34.4.0')")
          if "firebase-messaging" not in app_text:
              additions.append("    implementation 'com.google.firebase:firebase-messaging'")

          if additions:
              if re.search(r"dependencies\s*\{", app_text):
                  match = re.search(r"dependencies\s*\{", app_text)
                  end = app_text.find("}", match.end())
                  if end < 0:
                      raise SystemExit("หา dependencies block ปิดไม่พบ")
                  app_text = app_text[:end] + "\n" + "\n".join(additions) + "\n" + app_text[end:]
              else:
                  app_text += "\n\ndependencies {\n" + "\n".join(additions) + "\n}\n"

          app_gradle.write_text(app_text)

          # Keep the original manifest; add notification permission and service.
          manifest_text = manifest.read_text()
          permission = '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'
          if "android.permission.POST_NOTIFICATIONS" not in manifest_text:
              manifest_text = manifest_text.replace(
                  "<application",
                  permission + "\n    <application",
                  1
              )

          if "SweetConnectMessagingService" not in manifest_text:
              service = '''
                  <service
                      android:name=".SweetConnectMessagingService"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="com.google.firebase.MESSAGING_EVENT" />
                      </intent-filter>
                  </service>
              '''
              manifest_text = manifest_text.replace(
                  "</application>",
                  service + "\n</application>",
                  1
              )

          manifest.write_text(manifest_text)
          print("ตั้งค่า Firebase และ Manifest แล้ว")
          PY

      - name: Build APK
        run: |
          set -eu
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetConnect-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
