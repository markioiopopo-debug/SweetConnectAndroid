name: Build SweetConnect APK

'on':
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unzip project
        run: |
          set -eu
          unzip -o SweetConnectAndroid-project.zip -d extracted
          find extracted -name settings.gradle -print

      - name: Find Android project
        run: |
          set -eu
          PROJECT_DIR=$(find extracted -name settings.gradle -printf '%h\n' | head -1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Copy latest app files
        run: |
          set -eu
          TARGET="$PROJECT_DIR/app/src/main"
          SOURCE="$GITHUB_WORKSPACE/app/src/main"

          test -f "$SOURCE/assets/index.html"
          test -f "$SOURCE/java/com/sweetconnect/app/MainActivity.java"
          test -f "$SOURCE/java/com/sweetconnect/app/SweetConnectMessagingService.java"

          mkdir -p "$TARGET/assets"
          mkdir -p "$TARGET/java/com/sweetconnect/app"

          cp "$SOURCE/assets/index.html" "$TARGET/assets/index.html"
          cp "$SOURCE/java/com/sweetconnect/app/MainActivity.java" \
             "$TARGET/java/com/sweetconnect/app/MainActivity.java"
          cp "$SOURCE/java/com/sweetconnect/app/SweetConnectMessagingService.java" \
             "$TARGET/java/com/sweetconnect/app/SweetConnectMessagingService.java"

          cp "$SOURCE/AndroidManifest.xml" "$TARGET/AndroidManifest.xml"

      - name: Configure Firebase
        run: |
          set -eu
          test -f "$GITHUB_WORKSPACE/google-services.json"
          cp "$GITHUB_WORKSPACE/google-services.json" \
             "$PROJECT_DIR/app/google-services.json"

          python3 - "$PROJECT_DIR" <<'PY'
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          root_gradle = root / "build.gradle"
          app_gradle = root / "app/build.gradle"

          root_text = root_gradle.read_text()
          plugin = "id 'com.google.gms.google-services' version '4.4.4' apply false"
          if "com.google.gms.google-services" not in root_text:
              root_gradle.write_text(
                  root_text.rstrip()[:-0] + "\n" + plugin + "\n"
              )

          app_text = app_gradle.read_text()
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.replace(
                  "plugins {",
                  "plugins {\n    id 'com.google.gms.google-services'",
                  1
              )

          if "firebase-bom" not in app_text:
              app_text += """
          dependencies {
              implementation 'androidx.core:core:1.15.0'
              implementation platform('com.google.firebase:firebase-bom:34.4.0')
              implementation 'com.google.firebase:firebase-messaging'
          }
          """
          app_gradle.write_text(app_text)
          PY

      - name: Build APK
        run: |
          set -eu
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SweetConnect-APK
          path: extracted/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
